name: Bake city trip data

# 触发：
#  - schedule: 每天北京时间 02:00 自动抓取（GitHub Actions 用 UTC，
#              02:00 CST = 前一天 18:00 UTC）
#  - workflow_dispatch: 在 Actions 页面手动点「Run workflow」随时触发
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

# 权限：
#  - contents: write  —— 提交烘焙数据回仓库（构建期兜底 / B 通道）
#  - pages: write + id-token: write —— 用官方 Actions 方式部署 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 避免同一时刻多次运行互相覆盖
concurrency:
  group: bake-data
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    # Pages 官方部署模式需要在 job 上声明 environment（固定名称 github-pages）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1) 抓取 citymap.348349.xyz（无需 key，坐标为 GCJ-02，与微信 map 同系）。
      #    全量小程序已知城市；单城失败仅告警不中断。带重试容错。
      - name: Bake from citymap (no key)
        run: node miniprogram/utils/gen_citymap_report.js

      # 2) 烘焙权威源（腾讯地图 / 和风天气）。
      #    P0：仅在配置了密钥时才运行，避免无 key 时回落 bundled 覆盖仓库里更好的 authoritative 数据。
      #    配置了密钥但配额耗尽时，生成器仍会优雅回落并诚实标记，不会失败。
      - name: Bake authoritative (Tencent / 和风)
        if: ${{ secrets.TENCENT_MAP_KEY != '' || secrets.QWEATHER_KEY != '' }}
        env:
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
        run: node miniprogram/utils/gen_real_reports.js

      # 3) 合并为运行时可拉取的 JSON，并计算归一化 hash 判断是否有实质变化。
      #    输出 changed=1/0 供后续步骤决定是否提交/部署（P2：无变化跳过，减少噪声与配额消耗）。
      - name: Build runtime JSON & detect change
        id: build
        run: |
          node miniprogram/utils/build_citydata.js | tee build.log
          CHANGED=$(grep -oE 'CHANGED=[01]' build.log | tail -1 | cut -d= -f2)
          echo "changed=${CHANGED:-1}" >> "$GITHUB_OUTPUT"

      # 4) 校验闸门（P0 关键修复：校验的是最终合并产物 bake-dist/cityData.json）。
      #    坐标越界 / 缺字段 / authSource 非法 -> exit(1) 阻断发布，保留上一版可用数据。
      - name: Validate merged data (gate)
        run: node miniprogram/utils/validate_bake.js

      # 5) 提交烘焙数据回仓库（[skip ci] 防止触发自身死循环）。
      #    P2：仅在有实质变化时提交；continue-on-error 防止无提交时阻断 Pages 发布。
      - name: Commit baked data
        if: ${{ steps.build.outputs.changed == '1' }}
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-bake city data [skip ci]'
          file_pattern: 'miniprogram/utils/realCityData*.js bake-dist/cityData.json bake-dist/.datahash bake-dist/.merge_conflicts.json'

      # 6) 用官方 Actions 方式部署到 GitHub Pages（运行时拉取通道 A）。
      #    注意：仓库 Pages 设置 Build and deployment → Source 必须选
      #          **「GitHub Actions」**（不是 Deploy from a branch），不需要 gh-pages 分支。
      #    部署后访问：https://cool2feel.github.io/city_trip/cityData.json
      #    P2：仅在有实质变化时部署。
      - name: Upload Pages artifact
        if: ${{ steps.build.outputs.changed == '1' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./bake-dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.build.outputs.changed == '1' }}
        uses: actions/deploy-pages@v4

      # 7) P1：失败回执。任一前置步骤失败则自动开 Issue 告警（保留上一版数据）。
      - name: Open issue on failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[bake] 自动烘焙失败 ${date}`,
              body: `工作流运行失败，本次未发布新数据（已保留上一版可用数据）。\n\n排查：查看运行日志 ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      # 8) P1：结构化摘要（始终输出，便于在 Actions 日志/Summary 中核对覆盖与时效）。
      - name: Summary
        if: always()
        run: |
          echo "## Bake 摘要" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 build.log >> "$GITHUB_STEP_SUMMARY" || true

      # 9) P1：坐标冲突告警。合并时检测到的同名 POI 坐标差 > 500m 汇总进
      #    bake-dist/.merge_conflicts.json；此处读取并在 Summary 标注，供人工复核。
      #    冲突不阻塞发布（数据仍可用，已取高置信来源坐标）。
      - name: Surface merge conflicts
        if: always()
        run: |
          F="bake-dist/.merge_conflicts.json"
          if [ -f "$F" ] && [ "$(cat "$F")" != "[]" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## ⚠ 合并坐标冲突（需人工复核）" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$F" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 10) P2：多源冲突自动开 Issue。若合并检测到坐标冲突，自动创建（或向已存在
      #     的同名 Issue 追加评论，避免重复刷屏）数据质量 Issue，列出冲突坐标供人工复核。
      #     仅告警不阻塞发布。
      - name: Open issue on merge conflicts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const F = 'bake-dist/.merge_conflicts.json'
            let conflicts = []
            try { conflicts = JSON.parse(fs.readFileSync(F, 'utf8')) } catch (e) { conflicts = [] }
            if (!conflicts.length) { console.log('无合并坐标冲突，跳过开 Issue'); return }
            const title = '[bake] 合并坐标冲突需人工复核'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50
            })
            const dup = (existing.data || []).find(i => i.title === title)
            const body = `合并检测到同名 POI 坐标差 > 500m，已自动保留高置信来源坐标，请人工复核：\n\n` +
              '```json\n' + JSON.stringify(conflicts, null, 2) + '\n```\n\n' +
              `运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: dup.number,
                body: '再次触发（' + new Date().toISOString().slice(0, 10) + '）：\n' + body
              })
              console.log('已向已有 Issue #' + dup.number + ' 追加冲突评论')
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
                labels: ['bake', 'data-quality']
              })
              console.log('已创建冲突复核 Issue')
            }
